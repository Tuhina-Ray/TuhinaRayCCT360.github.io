<!DOCTYPE html>

<html>

    <head>
        <title> Lab 4: Interactive Logic </title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <h1> What type of Adventurer are you? </h1>
        <p> Answer the following questions to discover you adventurer type!</p>



        <h2>Question 1: You encounter a mysterious creature. What do you do?</h2>
    
        <button onclick="chooseMage(0, this)">Study it carefully</button>
        <button onclick="chooseKnight(0, this)">Prepare to fight</button>
        <button onclick="chooseMonk(0, this)">Try to communicate with it</button>

        <h2>Question 2: Which object would instrigue you the most?</h2>
        
        <button onclick="chooseMage(1, this)">A glowing spellbook</button>
        <button onclick="chooseKnight(1, this)">An Acient sword</button>
        <button onclick="chooseMonk(1, this)"> Magical Prayer Beads</button>

        <h2>Question 3: Your party is facing a difficult challenge. How do you help?</h2>
        
        <button onclick="chooseMage(2, this)"> Come up with a clever strategy</button>
        <button onclick="chooseKnight(2, this)"> Lead the Group into Battle</button>
        <button onclick="chooseMonk(2, this)"> Keep everyone calm and focused</button>

        <br>
        <br>
        <br>
        <br>

        <button onclick="showResult()"> See My Results</button>

        <h2 id="result"></h2>

        <script src="js/script.js"></script>

    </body>

</html>
