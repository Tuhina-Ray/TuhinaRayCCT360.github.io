<!DOCTYPE html>

<html>

    <head>
        <title> Lab 4: Interactive Logic </title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <h1> What type of Adventurer are you? </h1>
        <p> Answer the following questions to discover you adventurer type!</p>



        <h2>Question 1</h2>
        <p> You encounter a mysterious creature. What do you do?</p>

        <button onclick="chooseMage()">Study it carefully</button>
        <button onclick="chooseKnight()">Prepare to fight</button>
        <button onclick="chooseMonk()">Try to communicate with it</button>

        <h2>Question 2</h2>
        <p> Which object would instrigue you the most?</p>

        <button onclick="chooseMage()">A glowing spellbook</button>
        <button onclick="chooseKnight()">An Acient sword</button>
        <button onclick="chooseMonk()"> Magical Prayer Beads</button>

        <h2>Question 3</h2>
        <p> Your party is facing a difficult challenge. How do you help?</p>

        <button onclick="chooseMage()"> Come up with a clever strategy</button>
        <button onclick="chooseKnight()"> Lead the Group into Battle</button>
        <button onclick="chooseMonk()"> Keep everyone calm and focused</button>

        <br>
        <br>

        <button onclick="showResult()"> See My Results</button>

        <h2 id="result"></h2>

        <script src="js/script.js"></script>

    </body>

</html>
