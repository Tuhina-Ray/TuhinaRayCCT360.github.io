<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Soundscape</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h1>Listen to the Weather</h1>

      <p id="wind-speed">Loading...</p>

      <button id="play-button">Play Soundscape</button>

      <audio id="wind-audio" loop>
        <source src="audio/wind.mp3" type="audio/mpeg" />
      </audio>
    </main>

    <script src="script.js"></script>
  </body>
</html>
